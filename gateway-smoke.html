<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>HYYstudy 网关临时验证</title>
<h1>HYYstudy 网关临时验证</h1><p>仅用于合成测试音频，不使用麦克风。</p>
<label>访问码 <input id="code" type="password" autocomplete="off"></label>
<label>测试 WAV <input id="audio" type="file" accept="audio/wav,.wav"></label>
<button id="run">运行一次测试</button><p id="state">待开始</p>
<h2>英文原句</h2><pre id="en"></pre><h2>中文译文</h2><pre id="zh"></pre>
<script>
const $=id=>document.getElementById(id);
function b64(bytes){let s="";for(let i=0;i<bytes.length;i+=8192)s+=String.fromCharCode(...bytes.subarray(i,i+8192));return btoa(s)}
async function pcm(file){const ctx=new AudioContext();try{const decoded=await ctx.decodeAudioData(await file.arrayBuffer());const source=decoded.getChannelData(0);const count=Math.floor(source.length*16000/decoded.sampleRate);const out=new Int16Array(count);for(let i=0;i<count;i++){const at=i*decoded.sampleRate/16000,j=Math.floor(at),p=at-j;const v=(source[j]||0)*(1-p)+(source[Math.min(j+1,source.length-1)]||0)*p;out[i]=Math.max(-32768,Math.min(32767,Math.round(v*(v<0?32768:32767))))}return out}finally{await ctx.close()}}
$('run').addEventListener('click',async()=>{const code=$('code').value,file=$('audio').files[0];if(!code||!file){$('state').textContent='请填访问码和 WAV';return}$('code').value='';$('run').disabled=true;$('state').textContent='准备音频';const samples=await pcm(file);const ws=new WebSocket('wss://hyy-qwen-gateway.heyuyou071215.workers.dev/ws');let offset=0,timer=null;ws.onopen=()=>{ws.send(JSON.stringify({type:'gateway.auth',code}));$('state').textContent='已连接网关，等待千问'};ws.onmessage=e=>{let d;try{d=JSON.parse(e.data)}catch{return}if(d.type==='gateway.ready'){$('state').textContent='千问就绪，发送合成音频';timer=setInterval(()=>{if(offset>=samples.length){clearInterval(timer);timer=null;ws.send(JSON.stringify({type:'session.finish'}));$('state').textContent='音频已发送，等待结果';return}const end=Math.min(offset+3200,samples.length),chunk=samples.subarray(offset,end);ws.send(JSON.stringify({type:'input_audio_buffer.append',audio:b64(new Uint8Array(chunk.buffer,chunk.byteOffset,chunk.byteLength))}));offset=end},200)}else if(d.type==='conversation.item.input_audio_transcription.delta'){$('en').textContent+=d.delta||''}else if(d.type==='conversation.item.input_audio_transcription.completed'){$('en').textContent=d.transcript||$('en').textContent}else if(d.type==='response.text.delta'){$('zh').textContent+=d.delta||''}else if(d.type==='response.text.done'){$('zh').textContent=d.text||$('zh').textContent}else if(d.type==='session.finished'){$('state').textContent='已完成';ws.close()}else if(d.type==='gateway.error'||d.type==='error'||d.type==='gateway.auth_failed'){$('state').textContent='错误：'+(d.message||d.error?.message||d.type);if(timer)clearInterval(timer)}};ws.onerror=()=>{$('state').textContent='WebSocket 错误'};ws.onclose=()=>{if(timer)clearInterval(timer);$('run').disabled=false;if($('state').textContent!=='已完成'&&!$('state').textContent.startsWith('错误'))$('state').textContent+='；连接已关闭'};});
</script></html>
